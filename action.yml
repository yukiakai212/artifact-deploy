name: 'artifact-deploy'
description: 'Deploy selected artifact files to a GitHub repository.'

author: 'yukiakai212'

branding:
  icon: upload-cloud
  color: blue

inputs:
  source-directory:
    description: 'Directory containing artifact source files, relative to the GitHub workspace.'
    required: false
    default: '.'

  source-patterns:
    description: 'Newline-delimited glob patterns that select source files.'
    required: true

  target-repository:
    description: 'GitHub.com repository reference or URL that receives the artifact.'
    required: true

  target-directory:
    description: 'Directory in the target repository to receive the artifact.'
    required: false
    default: '.'

  branch:
    description: 'Target repository branch to prepare and push.'
    required: true

  token:
    description: 'Token with write access to the target repository.'
    required: true

  replace-target-directory:
    description: 'Delete existing target-directory content before copying the artifact.'
    required: false
    default: 'true'

  commit-message:
    description: 'Commit message used when deployment changes the target repository.'
    required: false
    default: 'deploy: update artifacts'

runs:
  using: 'node24'
  main: 'dist/action.cjs'
